<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraderBook — Mesa de Trading</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="container" id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <h1>📊 TraderBook</h1>
      <div class="subtitle">Mesa de Trading — Jirêh</div>
    </div>
    <button class="reset-btn" onclick="resetAll()">⟳ Resetar dados</button>
  </div>

  <!-- Config -->
  <div class="card">
    <div class="card-title">⚙️ Configuração</div>
    <div class="config-grid">
      <div class="config-field full">
        <label>Banca / Margem Inicial (R$)</label>
        <input type="number" id="initialBalance" value="1000" min="1" step="100">
      </div>
      <div class="config-field">
        <label>Fase Atual</label>
        <select id="phaseSelect">
          <option value="simulador">1️⃣ Simulador</option>
          <option value="fase1">2️⃣ Fase 1</option>
          <option value="real">3️⃣ Conta Real</option>
        </select>
      </div>
      <div class="config-field">
        <label>Meta de Lucro (R$)</label>
        <input type="number" id="goalAmount" value="10000" min="1" step="500">
      </div>
    </div>
  </div>

  <!-- Phase indicator -->
  <div class="phase-indicator" id="phaseIndicator"></div>

  <!-- Phase info -->
  <div class="phase-info" id="phaseInfo"></div>

  <!-- Stats Dashboard -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Progress -->
  <div class="card">
    <div class="card-title">📈 Progresso</div>
    <div class="progress-container">
      <div class="progress-header">
        <span id="progressLabel">R$ 0 / R$ 10.000</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>
    <div class="progress-meta">
      <span>🎯 Dias operados: <strong id="daysOperated">0</strong></span>
      <span>✅ Dias positivos: <strong id="daysPositive">0</strong></span>
      <span>⏱️ Dias restantes: <strong id="daysRemaining">60</strong></span>
    </div>
  </div>

  <!-- Metrics (streak, averages) -->
  <div class="card">
    <div class="card-title">📊 Métricas Avançadas</div>
    <div class="metrics-row" id="metricsGrid"></div>
  </div>

  <!-- Equity Chart -->
  <div class="card">
    <div class="card-title">📉 Curva de Equity</div>
    <div class="chart-container">
      <canvas id="equityChart"></canvas>
    </div>
  </div>

  <!-- Trade Log -->
  <div class="card">
    <div class="card-title">📝 Diário de Trading</div>
    <div class="action-row">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 Exportar CSV</button>
    </div>
    <div class="trade-form">
      <input type="date" id="tradeDate">
      <input type="number" id="tradeResult" placeholder="Resultado (R$)" step="0.01">
      <input type="text" id="tradeNotes" placeholder="Anotações (opcional)">
      <button class="btn btn-primary" onclick="addTrade()">+ Adicionar</button>
    </div>
    <div class="trade-list" id="tradeList">
      <div class="empty-state">
        <span class="icon">📭</span>
        Nenhum dia registrado ainda.<br>
        Adicione seu primeiro trade acima.
      </div>
    </div>
  </div>

  <!-- Regras da Mesa -->
  <div class="card">
    <div class="card-title">📜 Regras da Mesa</div>
    <div class="rules-box" id="rulesBox"></div>
  </div>

</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
